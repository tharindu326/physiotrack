name: Tests

# Runs the test suite on pull requests, and is exposed as a reusable workflow
# (`workflow_call`) so the release pipeline gates on it instead of duplicating
# this setup.
#
# Deliberately NOT triggered by pushes to main: the Release workflow already calls
# this one for every such push. With both active, two runs land in the
# `tests-refs/heads/main` concurrency group and one is cancelled --
# "Canceling since a higher priority waiting request ... exists" -- so every merge
# to main showed a failed Tests run even though the tests had passed inside
# Release. A red X that always means nothing is worse than no check at all.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags, so it needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install MediaPipe's system libraries
        # The mediapipe Linux wheel links libEGL/libGLESv2 even when it runs on the CPU;
        # the runner image does not ship them, so FaceLandmarks fails to load without.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2

      - name: Install CPU-only PyTorch
        # The default PyPI wheels pull the full CUDA stack, which is unnecessary on
        # CI runners and far slower to install. Resolve torch from the CPU index
        # first so the editable install below reuses it.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install physiotrack with test and face extras
        run: pip install -e ".[test,face]"

      - name: Cache model weights
        # The face-stage tests run the real (small) landmark, expression and gaze
        # models; caching PHYSIOTRACK_HOME downloads them once per key, not per run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/physiotrack
          key: physiotrack-weights-${{ hashFiles('src/physiotrack/models.py') }}

      - name: Verify the NeuroKit2 reference implementation is present
        # The HRV and artefact-correction tests cross-check against NeuroKit2 behind
        # importorskip. If it were missing they would skip silently and the suite
        # would pass while validating nothing. Fail loudly instead.
        run: python -c "import neurokit2; print('neurokit2', neurokit2.__version__)"

      - name: Verify the face extra and OpenCV import together
        # mediapipe declares opencv-contrib-python while ultralytics declares
        # opencv-python; both install into cv2/. Prove the combination imports.
        run: python -c "import cv2, mediapipe, onnxruntime, safetensors; print('cv2', cv2.__version__, 'mediapipe', mediapipe.__version__)"

      - name: Run tests
        run: pytest -q --cov=physiotrack --cov-report=term-missing --cov-report=xml

      - name: Fail if any test was skipped unexpectedly
        # A skip here means an optional dependency vanished from the test extra,
        # which silently weakens the suite. Surface it rather than hiding it.
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest-report.txt
          if grep -qE "^SKIPPED" pytest-report.txt; then
            echo "::error::Tests were skipped. Every test must run in CI:"
            grep -E "^SKIPPED" pytest-report.txt
            exit 1
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
