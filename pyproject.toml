[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "physiotrack"
description = "Contactless human sensing and body-signal extraction from RGB video: person detection, tracking, 2D/3D pose, face analysis, segmentation, monocular depth, and physiological signals (rPPG heart rate, HRV, respiration)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Tharindu Ekanayake", email = "physiotrack.ai@gmail.com" },
]
keywords = [
  "computer-vision",
  "human-pose-estimation",
  "pose-estimation",
  "rppg",
  "heart-rate",
  "heart-rate-variability",
  "respiration",
  "physiological-signals",
  "monocular-depth",
  "multi-object-tracking",
  "biomechanics",
  "range-of-motion",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]

# The version is derived from git tags by setuptools-scm (see [tool.setuptools_scm]).
# Tags are the single source of truth, so the packaged version cannot drift from the
# released tag. Read it at runtime via ``physiotrack.__version__``.
dynamic = ["version"]

# Runtime requirements for the documented code paths: the predictors, the model
# registry, the Video orchestrator, the trackers, and the signals subsystem.
# Lower bounds mark the oldest version verified to work; they are deliberately not
# pinned so the library can be co-installed with other scientific packages.
dependencies = [
  # numerics and I/O
  "numpy>=1.24",
  "scipy>=1.12",           # signals/filters.py relies on the firwin(fs=...) signature

  # 4.10 is the first release built against the NumPy 2 ABI. An older OpenCV
  # alongside NumPy >= 2 fails at import with
  # "numpy.core.multiarray failed to import", so this floor is load-bearing.
  "opencv-python>=4.10",
  "pandas>=2.0",
  "pillow>=10.0",
  "requests>=2.31",        # models.py weight downloads
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "imageio>=2.31",

  # analysis
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "fastdtw>=0.3.4",        # signals/evaluate.py

  # deep-learning runtime and model backends
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "timm>=0.9",
  "einops>=0.7",
  "easydict>=1.10",
  "mediapipe>=0.10.35",
  "emotiefflib>=1.1.1",
  "onnxruntime>=1.18",

  # tracking backends
  "lap>=0.4",              # ByteTrack / BoostTrack linear assignment
  "filterpy>=1.4.5",       # OC-SORT Kalman filter
  "gdown>=5.0",            # StrongSORT ReID weight fetch
  "six>=1.16",
]

[project.optional-dependencies]
# 3D SMPL mesh rendering for Pose3D (``render_video=True``).
pose3d = [
  "smplx>=0.1.28",
]

# Optional pretrained 3D gaze-estimation backend used by GazeEstimator.
# The existing landmark-based GazeDescriptor does not require this extra.
gaze = [
  "ptgaze==0.3.0",
]

docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-autorefs>=1.0",
  "pymdown-extensions>=10",
]

# neurokit2 is required rather than optional: the HRV and artefact-correction tests
# cross-check against it as a reference implementation. Without it those tests
# silently skip, which would leave the library's strongest correctness claim
# unverified in CI.
test = [
  "pytest>=7",
  "pytest-cov>=4.1",
  "neurokit2>=0.2.7",
]

[project.urls]
Homepage = "https://github.com/tharindu326/physiotrack"
Documentation = "https://tharindu326.github.io/physiotrack/"
Repository = "https://github.com/tharindu326/physiotrack"
Issues = "https://github.com/tharindu326/physiotrack/issues"
Changelog = "https://github.com/tharindu326/physiotrack/releases"

[tool.setuptools_scm]
# Fallback for builds from an archive with no git metadata. Keep in step with the
# most recent release tag.
fallback_version = "0.5.0"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physiotrack = ["assets/fonts/*.ttf", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::RuntimeWarning",
]